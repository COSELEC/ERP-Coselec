name: Deploy & Rollback ERP-Coselec

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA du commit pour un rollback manuel (laisser vide pour déployer HEAD)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: false
          script: |
            set -x  # Active le mode verbose pour voir chaque commande exécutée

            echo "=== [1/5] Vérification de l'environnement ==="
            whoami
            pwd
            which docker || echo "Docker introuvable !"
            docker --version || echo "Docker non installé !"
            docker compose version || docker-compose --version || echo "docker compose non trouvé !"
            ls -la /home/ubuntu/ERP-Coselec || echo "Répertoire ERP-Coselec introuvable !"

            echo "=== [2/5] Navigation vers le projet ==="
            cd /home/ubuntu/ERP-Coselec || { echo "ERREUR: Impossible d'accéder au répertoire."; exit 1; }
            ls -la .env || echo "ATTENTION: fichier .env manquant !"

            # Sauvegarder la version actuelle pour le rollback
            CURRENT_SHA=$(git rev-parse HEAD)
            echo "Version actuelle (point de rollback) : $CURRENT_SHA"

            echo "=== [3/5] Mise à jour du code ==="
            git fetch --all

            if [ -n "${{ github.event.inputs.commit_sha }}" ]; then
              echo "Rollback manuel vers : ${{ github.event.inputs.commit_sha }}"
              git reset --hard ${{ github.event.inputs.commit_sha }}
            else
              echo "Déploiement du dernier commit de main..."
              git reset --hard origin/main
            fi
            echo "Nouveau commit déployé : $(git rev-parse HEAD)"

            echo "=== [4/5] Build et relance des conteneurs ==="
            docker compose down || docker-compose down || true
            docker compose up -d --build 2>&1 || docker-compose up -d --build 2>&1 || { echo "ERREUR: docker compose up a échoué !"; exit 1; }

            echo "=== [5/5] Health Check (attente max 90s) ==="
            MAX_RETRIES=18
            SUCCESS=0
            for i in $(seq 1 $MAX_RETRIES); do
              sleep 5
              BACKEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs || echo "000")
              FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
              echo "Tentative $i/$MAX_RETRIES → Backend: $BACKEND | Frontend: $FRONTEND"
              if [ "$BACKEND" = "200" ] && [ "$FRONTEND" = "200" ]; then
                SUCCESS=1
                break
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo ""
              echo "❌ Health Check échoué ! Logs des conteneurs :"
              docker compose logs --tail=30 2>&1 || docker-compose logs --tail=30 2>&1 || true
              echo ""
              echo "🔄 Rollback vers la version stable : $CURRENT_SHA"
              git reset --hard $CURRENT_SHA
              docker compose down || true
              docker compose up -d --build 2>&1 || true
              exit 1
            fi

            echo ""
            echo "✅ Déploiement réussi ! Application opérationnelle."