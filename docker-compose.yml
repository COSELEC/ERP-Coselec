services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Autorise les requetes provenant du navigateur vers le backend
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80,http://35.181.155.29,http://35.181.155.29:80,http://erp.groupecoselec.com,https://erp.groupecoselec.com}
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: erp-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
